name: musiverse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP calls
  http: ^1.2.0
  file_picker: ^8.0.0

  # Audio playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.17

  # Local storage
  shared_preferences: ^2.2.2

  # Fonts
  google_fonts: ^6.1.0

  # Images
  cached_network_image: ^3.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/musiverse_logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/musiverse_logo.jpeg
