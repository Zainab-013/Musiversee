# ===============================
# CONFIG IMPORT (.env)
# ===============================
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE CONFIG (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musiverse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:zainab}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Automatically update schema (good for dev, not production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate will auto-select dialect; explicit setting optional
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER CONFIG
# ===============================
# Server port
server.port=${SERVER_PORT:8080}
# Bind to all interfaces (useful for testing in LAN)
server.address=0.0.0.0

# ===============================
# JWT CONFIG
